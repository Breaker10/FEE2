<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rock Paper Scissors</title>
    <style>
        body {
            background-color: rgb(25, 25, 25);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .title {
            font-weight: bold;
            font-size: 30px;
        }

        .move-icon {
            height: 50px;
        }

        .move-button {
            background-color: transparent;
            border: 2px solid white;
            border-radius: 50%;
            padding: 30px;
            margin-right: 10px;
            cursor: pointer;
        }
        .result{
            font-size: 25px;
            margin-top: 50px;
            font-weight: bold;
        }
        .score{
            margin-top: 40px;
        }
        .reset-score-button{
            border: none;
            font-size: 16px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h3 class="title">Rock Paper Scissors</h3>

    <button class="move-button" onclick="
        playGame('Rock', pickComputerMove());
        "><img class="move-icon" src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png"
            alt="Rock"></button>

    <button class="move-button" onclick="
        playGame('Paper', pickComputerMove());
        "><img class="move-icon" src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png"
            alt="Paper"></button>

    <button class="move-button" onclick="
        playGame('Scissors', pickComputerMove());
        "><img class="move-icon" src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png"
            alt="Scissors"></button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button" onclick="
score.wins = 0;
score.losses = 0;
score.ties = 0;
localStorage.removeItem('score');
updateScoreElement();
        let result = '';
        updateResult();
        ">Reset Score</button>

    <p><a href="">Click here</a> to see the final project.</p>
    <script src="10-rock-paper-scissors.js"></script>
</body>

</html>
